<!DOCTYPE html>
<html lang="en" class="bg-background">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0c0e">
    <meta name="google-site-verification" content="dvKKYev6im0XU4AEzXiDjxSktZTi5qMS__k-Yqq38yk" />
    <meta name="msvalidate.01" content="B38C44813DB0ABC9AA2C3E19D521160E" />
    <title>Service — independent search</title>
    <meta name="description" content="Service is an independent web search engine with its own crawler and index. No tracking, no profiles, no ad-tech surveillance — just results.">

    <link rel="stylesheet" href="style.css?v=4">
</head>
<!-- `home` scopes the landing-only rules (centred logotype, hidden chrome) to
     this page so they can't leak onto /about/, which shares this stylesheet.
     `app.js` adds `searching` on top of it once results are shown. -->
<body class="home">

<!-- Ad rails.
     These stay in the markup on every page, but CSS only reveals them in the
     results view (body.searching). Every major engine — Google, Bing, DDG,
     Brave — keeps its homepage clean and monetises the results page, which is
     also where the user has actually expressed intent, so this preserves the
     ad inventory that funds the project without wrecking the landing page. -->
<input type="checkbox" id="adRailLeft" class="ad-rail__toggle" autocomplete="off" hidden>
<aside class="ad-rail ad-rail--left" aria-label="Sponsored">
    <span class="ad-rail__label">Sponsored</span>
    <div class="ad-rail__frame">
        <iframe data-aa="2448733" src="//acceptable.a-ads.com/2448733/?size=Adaptive" title="Advertisement" loading="lazy"></iframe>
    </div>
    <label for="adRailLeft" class="ad-rail__dismiss" title="Hide this ad" role="button" tabindex="0">
        <svg width="10" height="10" viewBox="0 0 490 490" fill="currentColor" aria-hidden="true">
            <polygon points="456.851,0 245,212.564 33.149,0 0.708,32.337 212.669,245.004 0.708,457.678 33.149,490 245,277.443 456.851,490 489.292,457.678 277.331,245.004 489.292,32.337"/>
        </svg>
        <span class="sr-only">Hide advertisement</span>
    </label>
</aside>

<input type="checkbox" id="adRailRight" class="ad-rail__toggle" autocomplete="off" hidden>
<aside class="ad-rail ad-rail--right" aria-label="Sponsored">
    <span class="ad-rail__label">Sponsored</span>
    <div class="ad-rail__frame">
        <iframe data-aa="2448733" src="//acceptable.a-ads.com/2448733/?size=Adaptive" title="Advertisement" loading="lazy"></iframe>
    </div>
    <label for="adRailRight" class="ad-rail__dismiss" title="Hide this ad" role="button" tabindex="0">
        <svg width="10" height="10" viewBox="0 0 490 490" fill="currentColor" aria-hidden="true">
            <polygon points="456.851,0 245,212.564 33.149,0 0.708,32.337 212.669,245.004 0.708,457.678 33.149,490 245,277.443 456.851,490 489.292,457.678 277.331,245.004 489.292,32.337"/>
        </svg>
        <span class="sr-only">Hide advertisement</span>
    </label>
</aside>

<div class="shell">

    <header class="topbar">
        <!-- Hidden on the landing view (the centred logotype is the brand
             there) and revealed once the page becomes a results view. -->
        <a href="/" class="brand" aria-label="Service home">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>Service</span>
        </a>
        <nav aria-label="Primary">
            <a href="/live.html">Live index</a>
            <a href="/about/">About</a>
        </nav>
    </header>

    <main class="hero" id="hero">

        <!-- The signature element: a dashed ring in motion around a solid
             core — a crawler sweeping the web, an index at the centre. It is
             the only thing on the page allowed to be expressive. -->
        <h1 class="logo">
            <span class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none">
                    <circle class="logo-ring" cx="24" cy="24" r="20" stroke="currentColor"
                            stroke-width="2.75" stroke-dasharray="11 8" stroke-linecap="round"/>
                    <circle cx="24" cy="24" r="7.25" fill="currentColor"/>
                </svg>
            </span>
            <span class="logo-word">Service</span>
        </h1>

        <div class="search-box" role="search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
            </svg>
            <label for="searchInput" class="sr-only">Search the web</label>
            <input id="searchInput" type="text" placeholder="Search the web" autocomplete="off" autofocus>
            <button id="searchButton" type="button" class="search-submit" aria-label="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h13"></path>
                    <path d="m12 5 7 7-7 7"></path>
                </svg>
            </button>
        </div>

        <p class="tagline">Our own crawler. Our own index. No tracking.</p>

        <p id="pageCount" class="page-count"></p>

    </main>

    <div id="results"></div>

    <footer class="footer">
        <a href="/about/">About</a>
        <a href="/live.html">Live index</a>
        <a href="/robots.txt">Crawler</a>
    </footer>

</div>

<script src="app.js?v=4"></script>

</body>
</html>
