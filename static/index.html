<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="dvKKYev6im0XU4AEzXiDjxSktZTi5qMS__k-Yqq38yk" />

    <title>Service Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hero">
    <h1>Service</h1>
    <div class="search-box">
        <input
            id="searchInput"
            type="text"
            placeholder="Search the web..."
        >
        <button id="searchButton">
            Search
        </button>
    </div>
    <p id="pageCount" class="page-count"></p>
</div>
<div id="results"></div>

<!-- BEGIN PRIVADCY AD SLOT (left) -->
<div style="position: absolute; z-index: 99999">
  <input autocomplete="off" type="checkbox" id="privadcy-dismiss-left" hidden />
  <div style="padding-top: 0; padding-bottom: 0;">
    <div style="width:15%;height:100%;position:fixed;text-align:center;font-size:0;top:50%;transform:translateY(-50%);left:0;min-width:100px">
      <label for="privadcy-dismiss-left" style="bottom: 24px;margin:0 auto;right:0;left:0;max-width:24px; position: absolute;border-radius: 4px; background: rgba(248, 248, 249, 0.70); padding: 4px;z-index: 99999;cursor:pointer">
        <svg fill="#000000" height="16px" width="16px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 490">
          <polygon points="456.851,0 245,212.564 33.149,0 0.708,32.337 212.669,245.004 0.708,457.678 33.149,490 245,277.443 456.851,490 489.292,457.678 277.331,245.004 489.292,32.337 "/>
        </svg>
      </label>
      <div id="privadcy-frame-left" style="width: 100%;margin: auto;position: relative; z-index: 99998;height:100%; display: flex;flex-direction: column; justify-content: center">
        <iframe class="privadcy-iframe" src="https://privadcy.onrender.com/embed/sidebar?w=140&h=180" style="border:0; padding:0; width:140px; height:180px; overflow:hidden; margin: 0 auto"></iframe>
      </div>
    </div>
    <style>#privadcy-dismiss-left:checked + div { display: none; }</style>
  </div>
</div>
<!-- END PRIVADCY AD SLOT (left) -->

<!-- BEGIN PRIVADCY AD SLOT (right) -->
<div style="position: absolute; z-index: 99999">
  <input autocomplete="off" type="checkbox" id="privadcy-dismiss-right" hidden />
  <div style="padding-top: 0; padding-bottom: 0;">
    <div style="width:15%;height:100%;position:fixed;text-align:center;font-size:0;top:50%;transform:translateY(-50%);right:0;min-width:100px">
      <label for="privadcy-dismiss-right" style="bottom: 24px;margin:0 auto;right:0;left:0;max-width:24px; position: absolute;border-radius: 4px; background: rgba(248, 248, 249, 0.70); padding: 4px;z-index: 99999;cursor:pointer">
        <svg fill="#000000" height="16px" width="16px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 490">
          <polygon points="456.851,0 245,212.564 33.149,0 0.708,32.337 212.669,245.004 0.708,457.678 33.149,490 245,277.443 456.851,490 489.292,457.678 277.331,245.004 489.292,32.337 "/>
        </svg>
      </label>
      <div id="privadcy-frame-right" style="width: 100%;margin: auto;position: relative; z-index: 99998;height:100%; display: flex;flex-direction: column; justify-content: center">
        <iframe class="privadcy-iframe" src="https://privadcy.onrender.com/embed/sidebar?w=140&h=180" style="border:0; padding:0; width:140px; height:180px; overflow:hidden; margin: 0 auto"></iframe>
      </div>
    </div>
    <style>#privadcy-dismiss-right:checked + div { display: none; }</style>
  </div>
</div>
<!-- END PRIVADCY AD SLOT (right) -->

<script src="app.js?v=2"></script>
</body>
</html>
